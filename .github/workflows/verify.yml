name: Verify camera simulator
on:
  push:
    branches: [main, feature/photography-final-20261024]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm test
      - run: npm run audit:assets
      - run: node tools/audit-scene-plates.mjs public/scenes/barbershop-plates public/scenes/classroom-plates public/scenes/kitchen-plates public/scenes/apartment-plates public/scenes/classroom-desk-plates public/scenes/classroom-window-plates public/scenes/classroom-teacher-plates public/scenes/kitchen-pastry-plates public/scenes/kitchen-tea-plates
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.shard }}
          path: test-results/
      - name: Record deployment source
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.shard == 1
        env:
          SITE_COMMIT: ${{ github.sha }}
          SITE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node -e "require('node:fs').writeFileSync('dist/release.json', JSON.stringify({commit:process.env.SITE_COMMIT,run:process.env.SITE_RUN_URL}))"
      - name: Upload tested production site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.shard == 1
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@v6.0.0
      - name: Publish verified production artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
