<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="调整相机参数，练习曝光、对焦、运动和构图。">
  <link rel="icon" href="./favicon.png">
  <title>Camera Simulator · 摄影练习</title>
</head>
<body>
  <header><h1>Camera Simulator</h1><a href="./original.html">原版风扇演示</a></header>
  <main>
    <div class="toolbar" aria-label="拍摄设置">
      <label>场景 <select id="scene" aria-label="场景"></select></label>
      <label>模式 <select id="mode" aria-label="曝光模式"><option value="M">M 手动</option><option value="A">A 光圈优先</option><option value="S">S 快门优先</option><option value="P">P 程序自动</option></select></label>
      <label class="check"><input id="autoISO" type="checkbox" checked>自动 ISO</label>
      <button id="reset" type="button">重置参数</button><button id="capture" type="button">保存照片</button>
    </div>

    <section class="view-area" aria-label="取景器">
      <div id="viewfinder">
        <canvas id="image" tabindex="0" aria-label="相机画面。点击对焦，拖动取景，滚轮调整焦距。"></canvas>
        <div id="grid" hidden aria-hidden="true"></div>
        <div id="level" hidden aria-hidden="true"><i></i></div>
        <div id="focus-mark" hidden aria-hidden="true"></div>
        <canvas id="magnifier" width="200" height="150" hidden aria-label="局部放大"></canvas>
        <span id="magnifier-status" hidden role="status">精细图加载中…</span>
        <canvas id="histogram-view" width="180" height="76" hidden aria-label="亮度直方图"></canvas>
        <div id="loading" role="status">正在准备场景…</div>
      </div>
      <div class="view-caption"><span id="hint">点击对焦 · 拖动取景 · 滚轮变焦</span><output id="meter" aria-label="曝光偏差"></output></div>
    </section>
    <div class="view-tools" aria-label="对焦与画面辅助">
      <div class="view-actions"><button id="focus-center" type="button">中央对焦</button><button id="reset-view" type="button">重置取景</button></div>
      <div class="quick-assists" role="group" aria-label="画面辅助">
        <label class="check"><input id="grid-toggle" type="checkbox">九宫格</label>
        <label class="check"><input id="magnifier-toggle" type="checkbox" checked>局部放大镜</label>
        <label class="check"><input id="histogram-toggle" type="checkbox">直方图</label>
        <label class="check"><input id="zebra" type="checkbox">过曝条纹</label>
        <label class="check"><input id="level-toggle" type="checkbox">水平线</label>
      </div>
    </div>
    <section class="primary-controls" aria-label="常用参数">
      <label>光圈 <output id="aperture-value"></output><input id="aperture" type="range" min="0" max="8" step="1"></label>
      <label>快门 <output id="shutter-value"></output><input id="shutter" type="range" min="0" max="18" step="1"></label>
      <label>ISO <output id="iso-value"></output><input id="iso" type="range" min="0" max="9" step="1"></label>
      <label>白平衡 <output id="wb-value"></output><input id="wb" type="range" min="2000" max="10000" step="100"></label>
      <label>焦距 <output id="focal-value"></output><input id="focal" type="range" min="18" max="200" step="1"></label>
    </section>
    <p class="wheel-tip">画面上滚轮变焦 · 参数上滚轮微调 · 更多设置在下方分组</p>
    <div class="secondary-controls">
      <fieldset id="position-controls" hidden><legend>机位 <output id="position-status">中心</output></legend>
        <div class="position-layout"><div class="position-pad" role="group" aria-label="选择拍摄机位">
          <button data-position="up" style="grid-area:up" aria-label="升高20厘米">↑ 升高</button>
          <button data-position="left" style="grid-area:left" aria-label="左移30厘米">← 左移</button>
          <button data-position="center" style="grid-area:center" aria-pressed="true">中心</button>
          <button data-position="right" style="grid-area:right" aria-label="右移30厘米">右移 →</button>
          <button data-position="front" style="grid-area:front" aria-label="前移30厘米">靠近</button>
          <button data-position="down" style="grid-area:down" aria-label="降低20厘米">↓ 降低</button>
          <button data-position="back" style="grid-area:back" aria-label="后退30厘米">后退</button>
        </div><div id="subject-controls" hidden></div></div>
      </fieldset>
      <div id="more" class="tool-sections">
        <details id="focus-tools" name="camera-tools"><summary>对焦</summary><div class="tool-content">
          <label>对焦距离 <output id="focus-value"></output><input id="focus" type="range" min="0.2" max="50" step="0.1"></label>
          <label>对焦方式 <select id="af"><option>AF-S</option><option>AF-C</option><option>MF</option></select></label>

          <p>点击画面选取焦点；AF-C 持续跟随所选主体。</p>
        </div></details>
        <details id="composition-tools" name="camera-tools"><summary>构图</summary><div class="tool-content">

          <label>画幅 <select id="crop"><option value="21:9">横向 21:9</option><option value="3:2">横向 3:2</option><option value="16:9">横向 16:9</option><option value="2:3">竖向 2:3</option><option value="1:1">方形 1:1</option></select></label>
          <label>感光元件 <select id="sensor"><option value="full">全画幅</option><option value="aps-c">APS-C</option></select></label>
          <div id="legacy-view">
            <label>左右 <output id="x-value"></output><input id="x" type="range" min="-3" max="3" step="0.05"></label>
            <label>升降 <output id="y-value"></output><input id="y" type="range" min="-2" max="2" step="0.05"></label>
            <label>前后 <output id="z-value"></output><input id="z" type="range" min="-3" max="3" step="0.05"></label>
            <label>转向 <output id="yaw-value"></output><input id="yaw" type="range" min="-180" max="180" step="1"></label>
            <label>俯仰 <output id="pitch-value"></output><input id="pitch" type="range" min="-80" max="80" step="1"></label>

          </div>
          <label>倾斜 <output id="roll-value"></output><input id="roll" type="range" min="-20" max="20" step="1"></label>
        </div></details>
        <details id="assist-tools" name="camera-tools"><summary>曝光与辅助</summary><div class="tool-content">
          <label>曝光补偿 <output id="compensation-value"></output><input id="compensation" type="range" min="-9" max="9" step="1"></label>
          <label>测光 <select id="metering"><option value="matrix">多区</option><option value="center">中央重点</option><option value="spot">点测光</option></select></label>
          <label id="flash-control">补光强度 <output id="flash-value"></output><input id="flash" type="range" min="0" max="2" step="0.1"></label>
          <div id="motion-controls"><label class="check"><input id="motion" type="checkbox">运动练习球</label><label class="check"><input id="pause" type="checkbox">暂停运动</label></div>
        </div></details>
      </div>
    </div>
    <p id="lesson" role="status"></p>
    <details class="about"><summary>场景与使用说明</summary><p>选择机位，拖动画面取景，点击对焦。画面上向上滚轮拉近、向下拉远；参数上滚轮逐档调整，与滑杆方向一致；向上对应滑杆向右。其他区域仍正常翻页，Ctrl 或 Command 加滚轮保留浏览器缩放。用光圈、快门、ISO 和白平衡观察画面变化。</p><p id="credit"></p><p><a href="./ASSETS.md">场景来源与授权</a> · <a href="https://github.com/BW1145/CameraSimulator">项目源码</a> · 原版 <a href="https://github.com/leocb/CameraSimulator">leocb</a></p></details>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
